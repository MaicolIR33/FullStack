<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Stack Docker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Actividad SENA · Full Stack Docker</p>
      <h1>Directorio de usuarios</h1>
      <p class="intro">Frontend, API Express y MySQL comunicándose mediante Docker Compose.</p>
      <form id="user-form">
        <input id="user-id" name="id" type="hidden" />
        <label>Nombre <input name="name" maxlength="100" required /></label>
        <label>Correo <input name="email" type="email" maxlength="150" required /></label>
        <div class="actions">
          <button id="submit-button">Agregar usuario</button>
          <button id="cancel-button" class="secondary" type="button" hidden>Cancelar</button>
        </div>
      </form>
      <p id="message" role="status"></p>
      <section>
        <h2>Usuarios registrados</h2>
        <p id="user-count" class="count"></p>
        <ul id="user-list" aria-live="polite"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
